name: Notification Bot

on:
  schedule:
    - cron: '*/30 * * * *' # Check deadlines + announcements every 30 minutes
    - cron: '0 0 * * *'    # Daily summary at 00:00 UTC (7:00 AM Vietnam)
  workflow_dispatch: # Allow manual trigger
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'notify'
        type: choice
        options:
          - notify
          - summary
          - progress
          - announcements
          - sync-channels
          - sync-notion
          - sync-gcal

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'
            
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Determine run mode
        id: mode
        run: |
          # If triggered by schedule, check which cron triggered it
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
              echo "mode=summary" >> $GITHUB_OUTPUT
            else
              echo "mode=notify" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=${{ github.event.inputs.mode || 'notify' }}" >> $GITHUB_OUTPUT
          fi
        
      - name: Run script
        env:
          MOODLE_CALENDAR_URL: ${{ secrets.MOODLE_CALENDAR_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_SERVER_ID: ${{ secrets.DISCORD_SERVER_ID }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "summary" ]; then
            python main.py --summary
          elif [ "${{ steps.mode.outputs.mode }}" = "progress" ]; then
            python main.py --progress
          elif [ "${{ steps.mode.outputs.mode }}" = "announcements" ]; then
            python main.py --announcements
          elif [ "${{ steps.mode.outputs.mode }}" = "sync-channels" ]; then
            python main.py --sync-channels
          elif [ "${{ steps.mode.outputs.mode }}" = "sync-notion" ]; then
            python main.py --sync-notion
          elif [ "${{ steps.mode.outputs.mode }}" = "sync-gcal" ]; then
            python main.py --sync-gcal
          else
            python main.py
          fi

